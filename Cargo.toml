[package]
name = "ciphermesh"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "3", features = ["rand_core"] }
futures = "0.3"
getrandom = { version = "0.4", features = ["sys_rng"] }
hkdf = "0.13"
libp2p = { version = "0.56", features = ["autonat", "cbor", "dcutr", "identify", "kad", "macros", "mdns", "noise", "relay", "request-response", "tcp", "tokio", "yamux"] }
quinn = "0.11"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets"] }
