[package]
name = "ciphermesh"
version = "0.1.0"
edition = "2021"

[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hkdf = "0.13"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets"] }
