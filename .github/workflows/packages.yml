name: Package installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: .\scripts\package-windows-installer.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ciphermesh-windows-x64-installer
          path: dist/*-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.package_arch }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            package_arch: x64
          - runner: macos-15
            package_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build installer
        run: bash scripts/package-macos-installer.sh

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ciphermesh-macos-${{ matrix.package_arch }}-installer
          path: dist/*-macos-${{ matrix.package_arch }}.pkg
          if-no-files-found: error
